# KhataBoss — nginx site for https://khataboss.in
#
# Problem: If only `location /api/` is proxied to Node, Swagger works but `/` shows
# the default nginx welcome page instead of the Express marketing site.
#
# Fix: Proxy ALL paths to the Node app (port 9000), which serves:
#   /              → marketing website
#   /api/v1/*      → REST API
#   /api/v1/docs   → Swagger
#
# Install on Ubuntu/Debian:
#   sudo cp deploy/nginx.khataboss.in.conf /etc/nginx/sites-available/khataboss.in
#   sudo ln -sf /etc/nginx/sites-available/khataboss.in /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ensure PM2/systemd runs Khataboss-Backend with APP_PORT=9000 and latest code
# (folder public/website must exist on the server).

upstream khataboss_node {
    server 127.0.0.1:9000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name khataboss.in www.khataboss.in;

    # Redirect HTTP → HTTPS (adjust if cert is only on khataboss.in)
    return 301 https://khataboss.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name khataboss.in www.khataboss.in;

    # --- SSL: use certbot paths or your panel paths ---
    # ssl_certificate     /etc/letsencrypt/live/khataboss.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/khataboss.in/privkey.pem;

    client_max_body_size 50m;

    # Entire site → Express (website + API + Swagger)
    location / {
        proxy_pass http://khataboss_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
