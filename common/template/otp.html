<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #3f51b5;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .otp-box {
            font-size: 36px;
            font-weight: bold;
            color: #3f51b5;
            background-color: #e8eaf6;
            padding: 20px;
            border-radius: 8px;
            display: inline-block;
            letter-spacing: 5px;
            margin-bottom: 30px;
        }
        .footer {
            font-size: 14px;
            color: #999;
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Company Name</div>
        <h2>Verify Your Email</h2>
        <p>Hello {{username}},</p>
        <p>Your one-time password (OTP) for logging in is:</p>
        <div class="otp-box">
            {{otp}}
        </div>
        <p>This OTP is valid for 1 minute. Please do not share this code with anyone.</p>
        <div class="footer">
            If you did not request this OTP, please ignore this email or contact support.
        </div>
    </div>
</body>
</html>
