name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Cancel in-progress runs for the same branch
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check index.js || true

  # ─── Job 2: Prisma Validation ────────────────────────────────────────────────
  prisma:
    name: Prisma Client Generation
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (master schema)
        run: npx prisma generate --schema=prisma/schema/master/schema.prisma
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/master

      - name: Generate Prisma Client (main schema)
        run: npx prisma generate --schema=prisma/schema/main/schema.prisma
        env:
          DATABASE_MAIN_URL: postgresql://postgres:postgres@localhost:5432/main

      - name: Validate Prisma schema (master)
        run: npx prisma validate --schema=prisma/schema/master/schema.prisma

      - name: Validate Prisma schema (main)
        run: npx prisma validate --schema=prisma/schema/main/schema.prisma

  # ─── Job 3: Build & Migrate ──────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: prisma

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: master
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      OFFLINE_DB: 'true'
      DB_URL: postgresql://postgres:postgres@localhost:5432/master
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/master
      DATABASE_MASTER_URL: postgresql://postgres:postgres@localhost:5432/master
      DATABASE_MAIN_URL: postgresql://postgres:postgres@localhost:5432/main
      MASTER_DB_NAME: master
      JWT_SECRET: ${{ secrets.JWT_SECRET != '' && secrets.JWT_SECRET || 'ci-test-secret-key-minimum-32-chars-ok' }}
      APP_PORT: 9000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (master)
        run: npx prisma generate --schema=prisma/schema/master/schema.prisma

      - name: Generate Prisma Client (main)
        run: npx prisma generate --schema=prisma/schema/main/schema.prisma

      - name: Run Prisma Migrations (master)
        run: npx prisma migrate deploy --schema=prisma/schema/master/schema.prisma

      - name: Verify server module loads
        run: node -e "require('./server'); console.log('✅ Server module loaded OK');"

  # ─── Job 4: Security Audit ───────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high severity only)
        run: npm audit --audit-level=high --production || true
