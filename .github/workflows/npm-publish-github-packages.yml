name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Cancel in-progress runs for the same branch
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check index.js || true

  # ─── Job 2: Sync & Migrate ───────────────────────────────────────────────────
  sync:
    name: Sync Tenants
    runs-on: ubuntu-latest
    needs: lint

    env:
      NODE_ENV: production
      ONLINE_DB: 'true'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_MASTER_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_MAIN_URL: ${{ secrets.DATABASE_MAIN_URL }}
      MASTER_DB_NAME: master
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_PORT: 9000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        run: npm run sync

  # ─── Job 3: Security Audit ───────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high severity only)
        run: npm audit --audit-level=high --production || true
