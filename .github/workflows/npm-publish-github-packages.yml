name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Cancel in-progress runs for the same branch
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check index.js || true

  # ─── Job 2: Prisma Validation ────────────────────────────────────────────────
  prisma:
    name: Prisma Client Generation
    runs-on: ubuntu-latest
    needs: lint

    env:
      DB_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_MASTER_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_MAIN_URL: ${{ secrets.DATABASE_MAIN_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (master schema)
        run: npx prisma generate --schema=prisma/schema/master/schema.prisma

      - name: Generate Prisma Client (main schema)
        run: npx prisma generate --schema=prisma/schema/main/schema.prisma

      - name: Validate Prisma schema (master)
        run: npx prisma validate --schema=prisma/schema/master/schema.prisma

      - name: Validate Prisma schema (main)
        run: npx prisma validate --schema=prisma/schema/main/schema.prisma

  # ─── Job 3: Build & Migrate ──────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: prisma

    env:
      NODE_ENV: production
      ONLINE_DB: 'true'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_MASTER_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_MAIN_URL: ${{ secrets.DATABASE_MAIN_URL }}
      MASTER_DB_NAME: master
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_PORT: 9000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (master)
        run: npx prisma generate --schema=prisma/schema/master/schema.prisma

      - name: Generate Prisma Client (main)
        run: npx prisma generate --schema=prisma/schema/main/schema.prisma

      - name: Run Prisma Migrations (master)
        run: npx prisma migrate deploy --schema=prisma/schema/master/schema.prisma

      - name: Verify server module loads
        run: node -e "require('./server'); console.log('✅ Server module loaded OK');"

  # ─── Job 4: Security Audit ───────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high severity only)
        run: npm audit --audit-level=high --production || true
