name: Backend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Backend/**'
      - '.github/workflows/npm-publish-github-packages.yml'

  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'Backend/**'

# Cancel in-progress runs for the same branch
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Lint & Type Check ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check index.js || true

  # ─── Job 2: Generate Prisma Clients ──────────────────────────────────────────
  prisma:
    name: Prisma Client Generation
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (master schema)
        run: npx prisma generate --schema=prisma/schema/master/schema.prisma
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/master

      - name: Generate Prisma Client (main schema)
        run: npx prisma generate --schema=prisma/schema/main/schema.prisma
        env:
          DATABASE_MAIN_URL: postgresql://postgres:postgres@localhost:5432/main

      - name: Validate Prisma schema (master)
        run: npx prisma validate --schema=prisma/schema/master/schema.prisma

      - name: Validate Prisma schema (main)
        run: npx prisma validate --schema=prisma/schema/main/schema.prisma

  # ─── Job 3: Build & Test ─────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: prisma

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: master
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Backend

    env:
      NODE_ENV: test
      OFFLINE_DB: 'true'
      DB_URL: postgresql://postgres:postgres@localhost:5432/master
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/master
      DATABASE_MASTER_URL: postgresql://postgres:postgres@localhost:5432/master
      DATABASE_MAIN_URL: postgresql://postgres:postgres@localhost:5432/main
      MASTER_DB_NAME: master
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-key-minimum-32-chars' }}
      APP_PORT: 9000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (master)
        run: npx prisma generate --schema=prisma/schema/master/schema.prisma

      - name: Generate Prisma Client (main)
        run: npx prisma generate --schema=prisma/schema/main/schema.prisma

      - name: Run Prisma Migrations (master)
        run: npx prisma migrate deploy --schema=prisma/schema/master/schema.prisma

      - name: Verify server starts
        run: |
          timeout 15 node -e "
            process.env.SKIP_BOOTSTRAP = 'true';
            const app = require('./server');
            const server = app.listen(9000, () => {
              console.log('✅ Server started successfully');
              server.close();
              process.exit(0);
            });
          " || echo "Server check skipped"

  # ─── Job 4: Security Audit ───────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high severity only)
        run: npm audit --audit-level=high --production || true
